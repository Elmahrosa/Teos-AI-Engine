name: audit-self

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch codex_audit.sh from audit-tools
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
                "https://raw.githubusercontent.com/Elmahrosa/elmahrosa-org/main/audit-tools/codex_audit.sh" \
                -o codex_audit.sh; then
              break
            fi
            echo "fetch attempt $i failed, retrying..."
            sleep 5
          done
          [ -s codex_audit.sh ] || { echo "codex_audit.sh fetch failed after retries" >&2; exit 1; }
          chmod +x codex_audit.sh

      - name: Run readiness audit
        run: ./codex_audit.sh

      - name: Commit audit data
        env:
          AUDIT_TOOLS_PAT: ${{ secrets.AUDIT_TOOLS_PAT }}
        run: |
          set -e
          git config user.name "audit-hub-bot"
          git config user.email "actions@github.com"
          git add audit-data/ docs/data/
          if git diff --cached --quiet; then
            echo "No audit data changes"
            exit 0
          fi
          git commit -m "chore: refresh audit data [skip ci]"
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          PUSH_TOKEN="${AUDIT_TOOLS_PAT:-$GITHUB_TOKEN}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
